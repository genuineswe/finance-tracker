events {
    worker_connections 1024;
}

http {
    server {
        listen 80;
        server_name localhost;

        # Mengarahkan trafik root / ke frontend
        location / {
            proxy_pass http://frontend:3010; # Pastikan port sesuai dengan yang diekspos di dalam container frontend
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Mengarahkan trafik /api ke backend
        location /api/ {
            proxy_pass http://backend:3011/; # Pastikan port sesuai dengan yang diekspos di dalam container backend
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
