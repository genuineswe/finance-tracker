# ============================================
# 🐳 Full-Stack Docker Compose
# ============================================
# 4 Service: Nginx (Proxy) + React (frontend) + Node (API) + PostgreSQL (database)
#
# Perintah:
#   docker-compose up -d --build    → Nyalakan semua
#   docker-compose down             → Matikan semua
#   docker-compose logs -f          → Lihat logs semua service
#   docker-compose ps               → Cek status

services:
  nginx:
    image: nginx:alpine
    container_name: nginx_proxy
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - frontend
      - backend
    networks:
      - web_network
    restart: unless-stopped

  jenkins:
    image: jenkins/jenkins:lts
    extra_hosts:
      - "github.com:140.82.114.4"
    container_name: jenkins_server
    user: root # Menggunakan root sementara untuk mempermudah permission volume
    dns:
      - 8.8.8.8
      - 8.8.4.4
    ports:
      - "8080:8080"   # Port Utama untuk web UI Jenkins
      - "50000:50000" # Port komunikasi antara Controller dan Agent
    volumes:
      - jenkins_home:/var/jenkins_home  # Mount agar data/plugins tidak hilang saat container mati
    restart: unless-stopped

  db:
    image: postgres:15
    container_name: postgres_db
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    # Port mapping dihilangkan agar db tidak bisa diakses dari port host (meningkatkan keamanan)
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - db_network
    restart: unless-stopped

  backend:
    build: 
      context: ./backend
    container_name: express_api
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - PORT=${BACKEND_PORT}
    # Port mapping dihilangkan karena akses akan dilewati Nginx
    # Hindari mapping code di production (volumes dicomment)
    # volumes:
    #   - ./backend:/app
    #   - /app/node_modules
    depends_on:
      - db
    networks:
      - web_network
      - db_network
    restart: unless-stopped

  frontend:
    build: ./frontend
    container_name: nextjs_web
    environment:
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL}
    # Port mapping dihilangkan karena akses akan dilewati Nginx
    # Hindari mapping code di production (volumes dicomment)
    # volumes:
    #   - ./frontend:/app
    #   - /app/node_modules
    depends_on:
      - backend
    networks:
      - web_network
    restart: unless-stopped

networks:
  web_network:
    driver: bridge
  db_network:
    driver: bridge

volumes:
  pgdata:
  jenkins_home:
